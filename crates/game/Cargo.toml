[package]
name = "game"
version = "0.1.0"
description = "Woodshop Simulator: the Bevy game built on woodsim."
edition.workspace = true
rust-version.workspace = true

[dependencies]
bevy.workspace = true
plans.workspace = true
woodsim.workspace = true

# Putting plans up on the marketplace, from the game; the viewer on the web never does.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serde_json.workspace = true
ureq.workspace = true

[features]
# Faster incremental builds while developing: `cargo run -p game --features dev`.
# Never ship with this on.
dev = ["bevy/dynamic_linking"]
