[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
bevy = "0.20.0"
proptest = "1.12.0"
serde_json = "1.0.154"
# Putting plans up on the marketplace: HTTPS with rustls, nothing else.
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
plans = { path = "crates/plans" }
woodsim = { path = "crates/woodsim" }

# Bevy's recommended dev settings: optimize dependencies so the game runs smoothly,
# but keep our own crates at a low opt-level so they recompile quickly.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
